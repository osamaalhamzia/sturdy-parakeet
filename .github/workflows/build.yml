name: Build APK
on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Unpack project
        run: |
          mkdir app
          unzip -q project.zip -d app

      - name: Generate Android files
        working-directory: app
        run: |
          cp -r lib /tmp/lib_bak
          cp pubspec.yaml /tmp/pubspec_bak.yaml
          flutter create . --project-name qass_alwah --org com.qass --platforms=android
          rm -rf lib && cp -r /tmp/lib_bak lib
          cp /tmp/pubspec_bak.yaml pubspec.yaml
          rm -rf test
          sed -i 's/android:label="[^"]*"/android:label="قصّ الألواح"/' android/app/src/main/AndroidManifest.xml

      - name: Build APK
        working-directory: app
        run: |
          flutter pub get
          flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
